name: Release

# Publishing is irreversible: crates.io lets you yank a version but never
# delete or replace one, and a name is claimed forever. So the trigger is a
# deliberate act — a semver tag — never a push to main. The tag is also the
# SOURCE of the version: manifests are stamped from it at release time
# rather than hand-edited and kept in sync by hope.
#
# Release order across the two repositories:
#
#   1. tag bevy_pf_vector  (its own repo, its own Release workflow)
#   2. tag this repo       -> bevy_pf_xaml, bevy_pf_macros, bevy_pf
#
# Both tags can be pushed at once: this workflow WAITS for bevy_pf_vector to
# reach crates.io rather than failing the race.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify only — do not publish"
        type: boolean
        default: true
      version:
        description: "Version to stamp (blank = use the manifest as-is)"
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A bevy-linked verify build with full debuginfo fills a runner's disk
      # (the CI workflow measured ~28 GB); the release path does not need
      # line numbers.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System libraries bevy links on Linux
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev

      # Tag-driven semantic versioning: v1.4.0 publishes 1.4.0, and the
      # sibling requirements move with it (see .github/scripts/set-version.py
      # for why both have to). Prereleases work — v0.2.0-rc.1 is a valid tag
      # and crates.io accepts it without becoming the default version.
      - name: Version from the tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [ -n "$version" ]; then
            python3 .github/scripts/set-version.py "$version"
            echo "stamped=true" >> "$GITHUB_OUTPUT"
          else
            echo "no version given; using the manifest as-is (dry run)"
            echo "stamped=false" >> "$GITHUB_OUTPUT"
          fi

      # bevy_pf_vector is published from its own repository, so a
      # simultaneously-pushed pair of tags is a race this side should lose
      # gracefully rather than fail. The probe is cargo's own resolver —
      # --no-verify keeps it cheap, and --workspace lets the sibling crates
      # resolve locally so the ONLY thing that can be missing is the
      # cross-repo dependency.
      - name: Wait for bevy_pf_vector on crates.io
        run: |
          req=$(cargo metadata --no-deps --format-version 1 | python3 -c "
          import json, sys
          pkgs = json.load(sys.stdin)['packages']
          bp = next(p for p in pkgs if p['name'] == 'bevy_pf')
          print(next(d['req'] for d in bp['dependencies'] if d['name'] == 'bevy_pf_vector'))
          ")
          echo "bevy_pf requires bevy_pf_vector $req"
          # A real release waits out the sibling repo's build; a manual dry
          # run should say what is missing and stop, not idle for 30 minutes.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then attempts=60; else attempts=1; fi
          for attempt in $(seq 1 $attempts); do
            if cargo package --workspace --no-verify --allow-dirty >/tmp/probe.log 2>&1; then
              echo "resolved: bevy_pf_vector $req is on crates.io"
              exit 0
            fi
            if ! grep -q 'no matching package named `bevy_pf_vector`' /tmp/probe.log; then
              echo "::error::packaging failed for a reason other than the missing dependency"
              cat /tmp/probe.log
              exit 1
            fi
            echo "attempt $attempt/$attempts: no bevy_pf_vector matching $req yet"
            # An `&&` here would abort the step under `bash -e` on the last
            # iteration, swallowing the diagnosis below.
            if [ "$attempt" -lt "$attempts" ]; then sleep 30; fi
          done
          echo "::error::bevy_pf_vector $req never appeared on crates.io. Release https://github.com/edgarhsanchez/bevy_pf_vector first (tag it), or correct the requirement in crates/bevy_pf/Cargo.toml if the two versions have diverged."
          exit 1

      # --allow-dirty: the manifests were just rewritten from the tag, so the
      # checkout is intentionally dirty. The tag remains the record of what
      # was released.
      - name: Package and verify
        run: cargo package --workspace --allow-dirty

      # --workspace resolves the order (bevy_pf_xaml, then bevy_pf_macros,
      # then bevy_pf) and waits for each to reach the index before the next
      # one needs it — that ordering is a hard constraint, not a preference:
      # cargo strips `path` when packaging and resolves siblings from
      # crates.io.
      - name: Publish to crates.io
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --allow-dirty
