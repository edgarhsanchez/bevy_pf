name: Release

# Publishing is irreversible: crates.io lets you yank a version but never
# delete or replace one, and the name is claimed forever. So the trigger is
# an explicit, deliberate act — a `v*` tag — never a push to main. Use the
# manual run with `dry_run: true` to rehearse the whole thing safely.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify only — do not publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A bevy-linked verify build with full debuginfo fills a runner's disk
      # (the CI workflow measured ~28 GB); the release path does not need
      # line numbers.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System libraries bevy links on Linux
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev

      # The tag is the source of truth for what is being released, so a tag
      # that disagrees with the manifest is a mistake worth stopping for —
      # publishing the wrong version is not undoable. All three crates share
      # the workspace version, so checking one checks the release.
      - name: Tag must match the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='bevy_pf'))")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag manifest=$manifest"
          [ "$tag" = "$manifest" ] || { echo "::error::tag v$tag does not match Cargo.toml $manifest"; exit 1; }

      # The vector_gpu feature resolves bevy_pf_vector FROM THE REGISTRY —
      # cargo strips the git source when packaging — so that crate has to be
      # on crates.io before this workspace can be packaged at all, feature
      # off or not (optional deps are still resolved). Cargo's own message
      # for this is "no matching package named `bevy_pf_vector` found",
      # which is accurate and tells you nothing about what to do next.
      - name: bevy_pf_vector must already be published
        run: |
          req=$(cargo metadata --no-deps --format-version 1 | python3 -c "
          import json, sys
          pkgs = json.load(sys.stdin)['packages']
          bp = next(p for p in pkgs if p['name'] == 'bevy_pf')
          print(next(d['req'] for d in bp['dependencies'] if d['name'] == 'bevy_pf_vector'))
          ")
          code=$(curl -sS -o /tmp/vector.json -w "%{http_code}" \
            -A "bevy_pf-release-workflow" https://crates.io/api/v1/crates/bevy_pf_vector)
          if [ "$code" != "200" ]; then
            echo "::error::bevy_pf requires bevy_pf_vector $req from crates.io, which has no published versions (HTTP $code). Release https://github.com/edgarhsanchez/bevy_pf_vector first — tag it and let its Release workflow publish — then re-run this."
            exit 1
          fi
          echo "bevy_pf requires bevy_pf_vector $req; published versions:"
          python3 -c "import json; print('  ' + ', '.join(v['num'] for v in json.load(open('/tmp/vector.json'))['versions']))"

      - name: Package and verify
        run: cargo package --workspace

      # --workspace publishes bevy_pf_xaml, then bevy_pf_macros, then
      # bevy_pf, waiting for each to reach the index before the next one
      # needs it — the ordering is a real constraint, not a preference.
      #
      # Note the `vector_gpu` feature depends on bevy_pf_vector FROM THE
      # REGISTRY, so that crate must already be published at the version
      # this one asks for. It lives in its own repository with its own
      # release workflow; release it first.
      - name: Publish to crates.io
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace
