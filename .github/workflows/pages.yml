name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # The wasm build uses its own target dir (see site/build-wasm.sh).
          workspaces: ". -> target-wasm"

      - name: Install wasm-bindgen-cli (must match Cargo.lock pin)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126

      - name: Install wasm-opt (pinned binaryen — apt's is years old and corrupts modern wasm)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_130/bin" >> "$GITHUB_PATH"

      - name: Build wasm bundles (WebGPU + WebGL2)
        run: ./site/build-wasm.sh

      - name: Validate wasm binaries (browsers must accept them)
        run: |
          for f in site/wasm/*/*_bg.wasm; do
            node -e "const fs=require('fs'); if(!WebAssembly.validate(fs.readFileSync('$f'))) { console.error('INVALID: $f'); process.exit(1); } console.log('valid: $f');"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
