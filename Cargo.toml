[workspace]
resolver = "3"
members = [
    "crates/bevy_pf_xaml",
    "crates/bevy_pf_macros",
    "crates/bevy_pf",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edgarhsanchez/bevy_pf"
authors = ["bevy_pf contributors"]

[workspace.dependencies]
bevy_pf_xaml = { path = "crates/bevy_pf_xaml", version = "0.2.2" }
bevy_pf_macros = { path = "crates/bevy_pf_macros", version = "0.2.2" }
bevy_pf = { path = "crates/bevy_pf", version = "0.2.2" }

bevy = { version = "0.19", default-features = true, features = ["bevy_ui_widgets"] }
roxmltree = "0.21"
tiny-skia = "0.12"
thiserror = "2.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Production-optimal native builds: whole-program LTO and a single codegen
# unit give the optimizer full cross-crate visibility (+7.3% mean FPS across
# the benchmark suite vs stock release). Trades longer compile times for
# runtime performance; note `cargo test --release` re-links every test
# binary under fat LTO and is slow — plain `cargo test` (dev profile) is
# unaffected.
[profile.release]
lto = "fat"
codegen-units = 1

# Web bundles: size over compile time (downloads dominate perceived perf on
# the web, and browser presents are vsync-capped anyway). Used by
# site/build-wasm.sh.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
# thin, not fat: fat LTO on a bevy-sized wasm link exceeds CI runner memory
# (exit 143 OOM on 16 GB); thin costs a few percent size after wasm-opt -Oz.
lto = "thin"
codegen-units = 1
strip = true
