[package]
name = "bevy_pf"
description = "A XAML / WPF-like UI framework for Bevy: XAML in macros or files, styling with resources, and the common WPF control set."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Watch asset files and re-instantiate XamlView trees on change.
hot_reload = ["bevy/file_watcher"]
# Render WPF shapes on the GPU with bevy_pf_vector (tessellate-once +
# instanced, drawn into a shared atlas) instead of CPU tiny-skia
# rasterization. The CPU path stays as the fallback for anything the atlas
# cannot fit, so enabling this is additive.
vector_gpu = ["dep:bevy_pf_vector"]
# Draw <Rectangle>/<Ellipse> with bevy_ui's own GPU node rendering
# (border_radius + BackgroundColor + BorderColor) instead of rasterizing
# them. Measured at PARITY in-game (127-147 fps vs a 137-159 baseline), not
# a win, and not yet visually verified against the obsidian chrome -- so it
# is opt-in until someone looks at it. See "WHY THE BENCHMARKS LIED".
native_shapes = []

[dependencies]
bevy = { workspace = true }
bevy_pf_xaml = { workspace = true }
bevy_pf_macros = { workspace = true }
thiserror = { workspace = true }
tiny-skia = { workspace = true }
# Resolved from GitHub so every checkout (CI included) can load the
# workspace manifest -- a machine-local path here breaks `cargo metadata`
# on any other machine. For local engine development, override with a
# [patch."https://github.com/edgarhsanchez/bevy_pf_vector"] entry in an
# untracked .cargo/config.toml pointing at your clone.
bevy_pf_vector = { git = "https://github.com/edgarhsanchez/bevy_pf_vector", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window"] }
js-sys = "0.3"

# These two drive the `vector_gpu` atlas backend directly, so they reference
# `bevy_pf::shapes_gpu` -- a module that only exists with that feature on.
# Without required-features, a plain `cargo test` builds them anyway and fails
# to compile the package.
[[example]]
name = "shapes_gpu_check"
required-features = ["vector_gpu"]

[[example]]
name = "shapes_backend_bench"
required-features = ["vector_gpu"]
