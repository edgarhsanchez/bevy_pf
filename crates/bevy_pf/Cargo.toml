[package]
name = "bevy_pf"
description = "A XAML / WPF-like UI framework for Bevy: XAML in macros or files, styling with resources, and the common WPF control set."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bevy", "xaml", "wpf", "ui", "gui"]
categories = ["game-development", "gui"]
authors.workspace = true

[features]
# On by default so text inputs paste on desktop. Android consumers take
# default-features = false and re-add what they need: arboard, the crate
# behind bevy's system_clipboard, has no Android backend and fails to
# COMPILE for that target.
default = ["clipboard", "native_shapes"]
clipboard = ["bevy/system_clipboard"]
# Watch asset files and re-instantiate XamlView trees on change.
hot_reload = ["bevy/file_watcher"]
# Render WPF shapes on the GPU with bevy_pf_vector (tessellate-once +
# instanced, drawn into a shared atlas) instead of CPU tiny-skia
# rasterization. The CPU path stays as the fallback for anything the atlas
# cannot fit, so enabling this is additive.
vector_gpu = ["dep:bevy_pf_vector", "dep:guillotiere"]
# Draw <Rectangle>/<Ellipse> with bevy_ui's own GPU node rendering
# (border_radius + BackgroundColor + BorderColor) instead of rasterizing
# them. This is the default path for solid rectangles and circles: it stays in
# Bevy's existing UI pass and adds no texture, atlas, camera, or render pass.
# Unsupported geometry and paint still fall through to tiny-skia.
native_shapes = []

[dependencies]
bevy = { workspace = true }
bevy_pf_xaml = { workspace = true }
bevy_pf_macros = { workspace = true }
thiserror = { workspace = true }
tiny-skia = { workspace = true }
# From the registry: crates.io refuses to publish a crate carrying a bare
# git dependency, feature-gated or not. For local engine development,
# override with a [patch.crates-io] entry in an untracked
# .cargo/config.toml pointing at your clone.
bevy_pf_vector = { version = "0.1.1", optional = true }
# ALREADY IN THE GRAPH: bevy_image depends on it for bevy's own dynamic
# texture atlas, so this is a name for something already compiled in rather
# than a new dependency.
#
# It replaces a hand-rolled shelf packer whose freed regions could only ever
# be handed back at their EXACT original size and were never merged with
# their neighbours. Fragmentation therefore only accumulated, and the only
# way to reclaim it was to rebuild the whole atlas -- which drops every
# reservation for a frame, and reads to a player as the entire UI blinking.
# Guillotine allocation merges a freed rectangle with its siblings and
# collapses it into its parent, so the space comes back usable.
guillotiere = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window"] }
js-sys = "0.3"

# These two drive the `vector_gpu` atlas backend directly, so they reference
# `bevy_pf::shapes_gpu` -- a module that only exists with that feature on.
# Without required-features, a plain `cargo test` builds them anyway and fails
# to compile the package.
[[example]]
name = "shapes_gpu_check"
required-features = ["vector_gpu"]

[[example]]
name = "shapes_backend_bench"
required-features = ["vector_gpu", "native_shapes"]
